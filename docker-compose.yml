services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ExamplePassword123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'ExamplePassword123!' -C -Q 'SELECT 1' || exit 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend/ExampleAuth.Api
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ExampleAuth;User Id=sa;Password=ExamplePassword123!;TrustServerCertificate=True;"
      Jwt__Key: "example-com-development-key-change-me-123456789"
      Jwt__Issuer: "example.com"
      Jwt__Audience: "example.com"
    ports:
      - "5000:5000"
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  sqlserver-data:
